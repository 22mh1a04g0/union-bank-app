{% extends "base.html" %}
{% block content %}
<h2 class="page-title">Withdraw Money</h2>

<div class="card" style="max-width: 500px; margin: 0 auto;">
    <div style="text-align: center; margin-bottom: 20px; color: var(--primary-red); font-size: 3rem;">
        <i class="fas fa-arrow-circle-up"></i>
    </div>
    <p style="text-align: center; margin-bottom: 20px; color: var(--text-muted);">Current Balance: <strong>${{ "{:,.2f}".format(current_user.balance) }}</strong></p>
    
    <form method="POST" action="">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
        <div class="form-group">
            <label for="amount">Amount ($)</label>
            <input type="number" step="0.01" min="1" class="form-control" id="amount" name="amount" required placeholder="Enter amount to withdraw">
        </div>
        <button type="submit" class="btn btn-danger btn-block">Withdraw Now</button>
    </form>
</div>
{% endblock %}
