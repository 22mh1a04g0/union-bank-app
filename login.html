{% extends "base.html" %}
{% block auth_content %}
<div class="auth-container">
    <div class="auth-card">
        <h2>Secure Login</h2>
        <form method="POST" action="">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" class="form-control" id="email" name="email" required placeholder="Enter your email">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" class="form-control" id="password" name="password" required placeholder="Enter your password">
            </div>
            <button type="submit" class="btn btn-primary btn-block">Login</button>
        </form>
        <div style="margin-top: 20px; text-align: center;">
            <a href="{{ url_for('forgot_password') }}" style="color: var(--primary-blue); text-decoration: none;">Forgot Password?</a>
            <p style="margin-top: 10px; color: var(--text-muted);">Don't have an account? <a href="{{ url_for('register') }}" style="color: var(--primary-red); text-decoration: none;">Register Now</a></p>
        </div>
    </div>
</div>
{% endblock %}
