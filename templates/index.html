{% extends "base.html" %}
{% block auth_content %}
<div class="auth-container">
    <div style="text-align: center; color: white; margin-right: 50px;" class="welcome-section">
        <h1 style="font-size: 3rem; margin-bottom: 20px;"><i class="fas fa-university"></i> Union Bank</h1>
        <p style="font-size: 1.2rem; max-width: 400px; margin: 0 auto 30px;">Experience modern, secure, and fast banking with our new application platform.</p>
        <div>
            <a href="{{ url_for('login') }}" class="btn btn-primary" style="margin-right: 15px; padding: 15px 30px; font-size: 1.1rem; background-color: #fff; color: var(--primary-blue);">Login</a>
            <a href="{{ url_for('register') }}" class="btn btn-danger" style="padding: 15px 30px; font-size: 1.1rem; background-color: transparent; border: 2px solid #fff;">Open Account</a>
        </div>
    </div>
</div>
{% endblock %}
