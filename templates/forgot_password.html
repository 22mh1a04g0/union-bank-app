{% extends "base.html" %}
{% block auth_content %}
<div class="auth-container">
    <div class="auth-card">
        <h2>Reset Password</h2>
        <p style="text-align: center; color: var(--text-muted); margin-bottom: 20px;">Enter your email to receive a password reset link.</p>
        <form method="POST" action="">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" class="form-control" id="email" name="email" required placeholder="Enter your email">
            </div>
            <button type="submit" class="btn btn-primary btn-block">Send Reset Link</button>
        </form>
        <div style="margin-top: 20px; text-align: center;">
            <a href="{{ url_for('login') }}" style="color: var(--primary-blue); text-decoration: none;">Back to Login</a>
        </div>
    </div>
</div>
{% endblock %}
