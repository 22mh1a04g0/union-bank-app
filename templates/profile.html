{% extends "base.html" %}
{% block content %}
<h2 class="page-title">My Profile</h2>

<div class="card" style="max-width: 600px; margin: 0 auto;">
    <div style="text-align: center; margin-bottom: 30px;">
        <div style="width: 120px; height: 120px; border-radius: 50%; background-color: var(--primary-blue); color: white; display: inline-flex; align-items: center; justify-content: center; font-size: 3rem; margin-bottom: 15px;">
            <i class="fas fa-user-circle"></i>
        </div>
        <h3 style="color: var(--text-main);">{{ current_user.full_name }}</h3>
        <p style="color: var(--text-muted);">Account Number: {{ current_user.account_number }}</p>
        <p style="color: var(--text-muted);">Email: {{ current_user.email }}</p>
    </div>
    
    <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 20px 0;">
    
    <h4 style="margin-bottom: 15px; color: var(--text-main);">Update Profile</h4>
    <form method="POST" action="">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
        <div class="form-group">
            <label for="full_name">Full Name</label>
            <input type="text" class="form-control" id="full_name" name="full_name" value="{{ current_user.full_name }}" required>
        </div>
        <button type="submit" class="btn btn-primary">Save Changes</button>
    </form>
</div>
{% endblock %}
