{% extends "base.html" %}
{% block content %}
<h2 class="page-title">Fund Transfer</h2>

<div class="card" style="max-width: 500px; margin: 0 auto;">
    <div style="text-align: center; margin-bottom: 20px; color: var(--primary-blue); font-size: 3rem;">
        <i class="fas fa-exchange-alt"></i>
    </div>
    <p style="text-align: center; margin-bottom: 20px; color: var(--text-muted);">Current Balance: <strong>${{ "{:,.2f}".format(current_user.balance) }}</strong></p>
    
    <form method="POST" action="">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
        <div class="form-group">
            <label for="account_number">Recipient Account Number</label>
            <input type="text" class="form-control" id="account_number" name="account_number" required placeholder="10-digit account number">
        </div>
        <div class="form-group">
            <label for="amount">Amount ($)</label>
            <input type="number" step="0.01" min="1" class="form-control" id="amount" name="amount" required placeholder="Enter amount to transfer">
        </div>
        <button type="submit" class="btn btn-primary btn-block">Transfer Funds</button>
    </form>
</div>
{% endblock %}
