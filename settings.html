{% extends "base.html" %}
{% block content %}
<h2 class="page-title">Settings</h2>

<div class="card" style="max-width: 600px; margin: 0 auto;">
    <form method="POST" action="">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
        
        <h4 style="margin-bottom: 15px; color: var(--text-main);">Preferences</h4>
        
        <div class="form-group" style="display: flex; align-items: center; gap: 10px;">
            <input type="checkbox" id="dark_mode" name="dark_mode" {% if current_user.dark_mode %}checked{% endif %} style="width: 20px; height: 20px;">
            <label for="dark_mode" style="margin-bottom: 0;">Enable Dark Mode (Saved to Profile)</label>
        </div>
        
        <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 20px 0;">
        
        <h4 style="margin-bottom: 15px; color: var(--text-main);">Security Settings</h4>
        <p style="color: var(--text-muted); margin-bottom: 15px;">To change your password, please use the Forgot Password functionality or contact support.</p>
        
        <button type="submit" class="btn btn-primary">Save Settings</button>
    </form>
</div>
{% endblock %}
